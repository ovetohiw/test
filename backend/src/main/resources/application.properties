spring.application.name=phoneshop

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/phoneshop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:phoneshop}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:phoneshop}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.jwt.secret=${APP_JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
app.jwt.cookie-name=PHONESHOP_TOKEN
app.jwt.ttl-seconds=${APP_JWT_TTL_SECONDS:86400}

app.cors.origins=${APP_CORS_ORIGINS:http://localhost:3000}
app.upload-dir=${APP_UPLOAD_DIR:uploads}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}

app.yookassa.mode=${APP_YOOKASSA_MODE:stub}
app.yookassa.shop-id=${APP_YOOKASSA_SHOP_ID:}
app.yookassa.secret-key=${APP_YOOKASSA_SECRET_KEY:}
app.yookassa.api-url=${APP_YOOKASSA_API_URL:https://api.yookassa.ru/v3}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
