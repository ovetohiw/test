services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: phoneshop
      POSTGRES_USER: phoneshop
      POSTGRES_PASSWORD: phoneshop
    ports:
      - "5432:5432"
    volumes:
      - phoneshop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoneshop -d phoneshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/phoneshop
      SPRING_DATASOURCE_USERNAME: phoneshop
      SPRING_DATASOURCE_PASSWORD: phoneshop
      APP_JWT_SECRET: change-me-to-a-long-random-secret-at-least-32-chars
      APP_CORS_ORIGINS: http://localhost:8080
      APP_UPLOAD_DIR: /data/uploads
      APP_YOOKASSA_MODE: stub
      APP_YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      APP_YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      APP_PUBLIC_BASE_URL: http://localhost:8080
      APP_FRONTEND_BASE_URL: http://localhost:8080
    volumes:
      - phoneshop_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-cp", "/opt/hc", "HealthCheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:8080
    ports:
      - "8080:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ | head -c 1 | grep -q ."]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  phoneshop_pg:
  phoneshop_uploads:
